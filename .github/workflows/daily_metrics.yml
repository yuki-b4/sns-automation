name: Daily Metrics Collection 06:00 JST

on:
  # 一時停止中（2026-08-08〜）: 定時実行は投稿アイデア生成（post_ideas.yml・07:00 JST）のみに絞る運用。
  # 再開する場合は下の schedule 節のコメントを外す。手動実行(workflow_dispatch)は引き続き可能。
  # schedule:
  #   - cron: '0 21 * * *'  # UTC 21:00 = JST 06:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/collect_metrics.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
