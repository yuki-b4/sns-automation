name: Post 11:45 JST

on:
  # 一時停止中（2026-07-30〜）: Threadsへの自動投稿を停止し、投稿アイデア生成（post_ideas.yml・毎日07:00 JST）へ切り替えた運用。
  # 再開する場合は下の schedule 節のコメントを外す。手動実行(workflow_dispatch)は引き続き可能。
  # schedule:
  #   - cron: '45 2 * * *'  # UTC 02:45 = JST 11:45
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/generate_post.py
        env:
          POST_SLOT: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          # LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}  # LinkedIn 一時無効化
          # LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}  # LinkedIn 一時無効化
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
